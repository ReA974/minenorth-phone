plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
group='fr.minenorth'
version='1.0.0'
base { archivesName='minenorth-phone' }
java.toolchain.languageVersion=JavaLanguageVersion.of(17)
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
minecraft {
    mappings channel:'official', version:'1.20.1'
    copyIdeResources=true
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { minenorthphone { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { minenorthphone { source sourceSets.main } }
            args '--nogui'
        }
    }
}
repositories {
    flatDir { dirs '../minenorth-api/build/libs' }   // MineNorth API (builder minenorth-api d'abord)
}
dependencies {
    // MikasRevs Phone 2 : seulement pour compiler le fournisseur de monnaie (jar non redistribué, à déposer dans libs/)
    compileOnly files('libs/MRPhone 2 0.9.4 beta.jar')
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    implementation fg.deobf("blank:minenorth_api:1.0.0")
}
jar { manifest { attributes(['Specification-Title':'MineNorth Telephone (pont)','Specification-Vendor':'MineNorth RP','Specification-Version':'1','Implementation-Title':project.name,'Implementation-Version':project.version,'Implementation-Vendor':'MineNorth RP']) } }
jar.finalizedBy('reobfJar')
